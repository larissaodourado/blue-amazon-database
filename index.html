<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Amazon Database</title>
    <link rel="stylesheet" href="style.css">
    <!-- Preload WASM -->
    <link rel="preload" href="lib/RDKit_minimal.wasm" as="fetch" type="application/wasm" crossorigin>
</head>

<body>

    <!-- Header -->
    <header class="glass-header">
        <div class="container">
            <div class="brand">
                <div class="logo-icon">
                    <!-- Anchor Icon SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="5" r="3" />
                        <line x1="12" x2="12" y1="22" y2="8" />
                        <path d="M5 12H2a10 10 0 0 0 20 0h-3" />
                    </svg>
                </div>
                <div class="brand-text">
                    <h1 data-i18n="header.title">Blue Amazon Database</h1>
                    <p data-i18n="header.subtitle">Marine Natural Products</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="lang-selector">
                    <button type="button" class="lang-btn" data-lang="pt" aria-label="Português">PT</button>
                    <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
                </div>
                <a href="#" id="aboutBtn" class="nav-link" data-i18n="header.aboutLink">About Project</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Controls -->
        <div class="controls-bar">
            <div class="search-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <input type="text" id="searchInput" placeholder="Search compounds, smiles, species..." data-i18n-placeholder="search.placeholder">
            </div>

            <div class="filter-wrapper">
                <div class="select-wrapper">
                    <select id="pathwayFilter">
                        <option value="All" data-i18n="filter.allPathways">All Pathways</option>
                        <!-- Options populated via JS -->
                    </select>
                </div>
                <span id="resultCount" class="result-count">Loading...</span>
            </div>
        </div>

        <!-- Top Pagination -->
        <div class="pagination-container pagination-top js-pagination-container hidden">
            <button class="pagination-btn js-page-prev" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span data-i18n="pagination.prev">Previous</span>
            </button>
            <span class="page-info js-page-info">Showing 0-0 of 0</span>
            <button class="pagination-btn js-page-next">
                <span data-i18n="pagination.next">Next</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

        <!-- Grid -->
        <div id="compoundGrid" class="compound-grid">
            <!-- Loading State -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p data-i18n="states.loading">Loading Blue Amazon Data...</p>
            </div>
        </div>

        <!-- Pagination Controls -->
        <div id="paginationControls" class="pagination-container js-pagination-container hidden">
            <button id="prevPageBtn" class="pagination-btn js-page-prev" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span data-i18n="pagination.prev">Previous</span>
            </button>
            <span id="pageInfo" class="page-info js-page-info">Showing 0-0 of 0</span>
            <button id="nextPageBtn" class="pagination-btn js-page-next">
                <span data-i18n="pagination.next">Next</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p data-i18n="footer.text">&copy; 2026 Blue Amazon Database. Tracking Brazil's marine biodiversity.</p>
        </div>
    </footer>

    <!-- About Modal -->
    <div id="aboutModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel" style="max-width: 600px;">
            <button id="closeAboutModal" class="close-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>

            <div class="modal-body" id="aboutModalBody">
                <!-- Content rendered via JS for i18n support -->
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <button id="closeModal" class="close-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>

            <div class="modal-body" id="modalBody">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Load RDKit JS global -->
    <script src="lib/RDKit_minimal.js"></script>
    <script src="lib/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
